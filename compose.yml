# Podman Compose: `podman-compose up --build` (or `make up`).
# Configuration comes from .env (copy .env.example); all app settings use the AIC_ prefix.
x-app: &app
  build:
    context: .
    dockerfile: Containerfile
  image: localhost/ansible-infra-cd:latest
  env_file: .env
  environment:
    AIC_DB_HOST: db
    AIC_REDIS_HOST: redis
  depends_on:
    - db
    - redis

services:
  web:
    <<: *app
    command: ["web"]
    ports:
      - "${AIC_WEB_PORT:-8000}:8000"

  worker:
    <<: *app
    command: ["worker"]

  beat:
    <<: *app
    command: ["beat"]

  # Optional: Vite dev server with hot reload. `podman-compose --profile dev up frontend`
  frontend:
    profiles: ["dev"]
    image: registry.access.redhat.com/ubi9/nodejs-22
    working_dir: /opt/app-root/src/frontend
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes:
      - ./frontend:/opt/app-root/src/frontend:Z
    ports:
      - "5173:5173"

  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${AIC_DB_NAME:-ansibleinfracd}
      POSTGRES_USER: ${AIC_DB_USERNAME:-ansibleinfracd}
      POSTGRES_PASSWORD: ${AIC_DB_PASSWORD:?set AIC_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:7-alpine
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
